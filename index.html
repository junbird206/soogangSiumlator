<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수강신청 시뮬레이터</title>
  <meta name="description" content="전국에서 수강신청 젤 잘하는 사람은 누구?">
  <link rel="stylesheet" href="style.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GFGSC4P266"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GFGSC4P266');
  </script>
</head>
<body>
  <div id="app">
    <!-- View 1: Landing -->
    <div id="view-landing" class="view active">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="ko" onclick="setLang('ko')">🇰🇷</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇺🇸</button>
      </div>
      
      <header>
        <h1 data-i18n-html="title"><img src="img/dino.png" alt="dino" style="width: 48px; vertical-align: bottom; margin-right: 4px;">수강신청 시뮬레이터</h1>
        <p class="subtitle" data-i18n="subtitle">전국에서 수강신청 젤 잘하는 사람은 누구?</p>
      </header>
      
      <main>
        <ul class="rules">
          <li data-i18n-html="rule1"><strong>버튼은 딱 한 번만 누를 수 있습니다.</strong> 연타 불가.</li>
          <li data-i18n-html="rule2"><strong>정각 전 클릭은 광탈입니다.</strong></li>
          <li data-i18n-html="rule3"><strong>소리를 켜주세요.</strong> 5초 전부터 비프음이 울립니다.</li>
        </ul>

        <div class="promo-banner-global"></div>

        <div class="leaderboard-container">
          <h3 data-i18n="leaderboardTitle">🔥 오늘의 Top 5</h3>
          <ul id="leaderboard-list" class="leaderboard-list">
            <!-- 랭킹 아이템들이 여기에 렌더링됩니다 -->
            <li class="empty-leaderboard" data-i18n="leaderboardEmpty">아직 기록이 없습니다. 첫 기록의 주인공이 되어보세요!</li>
          </ul>
          <p class="report-hint" data-i18n="reportHint">닉네임이 불쾌하다면 꾹 눌러서 신고해주세요.</p>
        </div>
      </main>

      <footer>
        <button id="btn-ready" class="primary-btn" data-i18n="btnReady">도전 준비</button>
      </footer>
    </div>

    <!-- View 2: Ready -->
    <div id="view-ready" class="view">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="ko" onclick="setLang('ko')">🇰🇷</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇺🇸</button>
      </div>
      
      <main class="center-content">
        <h2 data-i18n-html="readyTitle"><img src="img/speaker.png" alt="speaker" style="width: 36px; vertical-align: middle; margin-right: 6px;">소리를 켜주세요</h2>
        <p data-i18n="readyDesc">비프음에 맞춰 정각에 버튼을 누르세요.</p>
        <button id="btn-start" class="primary-btn pulse" data-i18n="btnStart">시작하기</button>
      </main>
      <footer style="margin-top: auto; text-align: center;">
        <div class="promo-banner-global"></div>
      </footer>
    </div>

    <!-- View 3: Game -->
    <div id="view-game" class="view">
      <main class="center-content">
        <div class="clock-container">
          <div id="clock">09:59:50.00</div>
        </div>
        <!-- pointerdown 이벤트로 클릭 지연 방지 -->
        <button id="btn-action" class="action-btn" style="touch-action: manipulation;" data-i18n="btnAction">수강신청</button>
      </main>
    </div>

    <!-- View 4: Result -->
    <div id="view-result" class="view">
      <main class="center-content">
        <div id="result-status"></div>
        <div id="result-delay" class="delay-text"></div>
        <div class="badge" id="result-badge"></div>
        <p id="result-message" class="message-text"></p>
        
        <div class="record-compare" id="record-compare-container"></div>
        
        <div id="nickname-form-container" class="nickname-container" style="display: none;">
          <h4 data-i18n="nicknameTitle">명예의 전당에 기록 남기기</h4>
          <div class="nickname-input-group">
            <input type="text" id="nickname-input" maxlength="10" placeholder="닉네임 (최대 10자)" />
            <button id="btn-save-record" class="primary-btn" data-i18n="btnSaveRecord">저장</button>
          </div>
          <p id="nickname-error" class="error-msg"></p>
        </div>
        
        <div class="action-buttons">
          <button id="btn-share" class="primary-btn lg-btn" style="margin-bottom: 0.75rem;" data-i18n="btnShare">스토리에 공유하기</button>
          <button id="btn-retry" class="secondary-btn" data-i18n="btnRetry">다시 하기</button>
        </div>
      </main>
      
      <footer class="promo-footer">
        <h3 class="cta-title" data-i18n-html="ctaTitle"><img src="img/rocket.png" alt="rocket" style="width: 24px; vertical-align: middle; margin-right: 6px; transform: translateY(-2px);">이 게임, Gemini로 만들었습니다</h3>
        <p class="cta-body" id="cta-body"></p>
        <button id="btn-cta" class="tertiary-btn"></button>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="audio_b64.js"></script>
  <script src="script.js"></script>
</body>
</html>
